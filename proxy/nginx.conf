# =============================================================================
# Plantilla de nginx. La imagen oficial sustituye ${DOMAIN_NAME}, ${CERT_FILE},
# ${KEY_FILE}, ${PORT_PROXY_HTTPS} y ${REQUIRE_MTLS} al arrancar y la incluye
# dentro del bloque http.
# =============================================================================

server_tokens off;

# DNS interno de Docker: nginx arranca aunque algún backend aún no exista
resolver 127.0.0.11 valid=10s ipv6=off;
map "${REQUIRE_MTLS}" $soap_solo_mtls { "true" 1; default 0; }
# TLS: perfil "intermediate" de Mozilla, solo ECDHE (no necesita dhparam)
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
limit_req_zone $binary_remote_addr zone=sensia_auth:10m rate=10r/m;

# HTTP: salud, Let's Encrypt y redirección de la web a HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API y SOAP nunca por HTTP: error explícito, sin redirección
    location ^~ /api/      { return 403; }
    location ^~ /services/ { return 403; }

    # La web sí se redirige, para quien escriba http:// en el navegador
    location / {
        return 301 https://${DOMAIN_NAME}:${PORT_PROXY_HTTPS}$request_uri;
    }
}

# HTTPS: rechaza cualquier nombre que no sea el dominio
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

# HTTPS: aplicación
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN_NAME};

    ssl_certificate     /etc/nginx/certs/${CERT_FILE};
    ssl_certificate_key /etc/nginx/certs/${KEY_FILE};

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;

    location / {
        set $up_front http://frontend-app:80;
        proxy_pass $up_front;
    }
    location ^~ /api/auth/ {
        limit_req zone=sensia_auth burst=20 nodelay;
        limit_req_status 429;
        set $up_api http://backend-app:3000;
        proxy_pass $up_api;
    }
    location ^~ /api/ {
        set $up_api http://backend-app:3000;
        proxy_pass $up_api;
        # 50 MB de PDF en base64 ≈ 67 MB. Algo por encima de MAX_BODY_SIZE de backend-app
        client_max_body_size 75m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /services/ {
        if ($soap_solo_mtls) { return 403; }
        set $up_ws https://backend-ws:443;
        proxy_pass $up_ws;
        # SNI con el nombre del certificado de Jetty (si no, Jetty responde 400 "Invalid SNI")
        proxy_ssl_server_name on;
        proxy_ssl_name ${DOMAIN_NAME};
        
        # 50 MB de PDF en base64 ≈ 67 MB
        client_max_body_size 75m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}