processing.redactionPreview=false

processing.document.redactQRCodes=false
processing.document.redactNames=false
processing.document.redactNERNames=false
processing.document.redactNEROrg=false
processing.document.redactNERLoc=false
processing.document.redactNERMisc=false
processing.document.redactNERScore=0.65
processing.document.removeImages=false
processing.document.preserveLogo=true
processing.document.logoExclusionZone=0,700,200,142
processing.document.redactionThickness=2
processing.document.usePseudonyms=false
processing.face.maskFaces=true
processing.face.minFaceAspectRatio=0
processing.face.maxFaceAspectRatio=0
processing.face.minFaceArea=0.0
processing.face.maxFaceArea=0.0
processing.face.pixelationIntensity=70


# Resolución (ppp) del documento final
processing.document.outputDpi=200

# Idiomas de Tesseract
processing.ocr.lang=spa+eng

# Yunet
processing.yunet.scoreThreshold=0.30
processing.yunet.nmsThreshold=0.45
processing.yunet.topK=5000
# Segunda pasada de detección de rostros con el contraste realzado (CLAHE). Experimental:
# desactivada hasta validarla. Duplica el tiempo de detección.
processing.face.enhanceContrast=false
