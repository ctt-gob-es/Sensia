# ==========================================
# Configuración token de seguridad
# ==========================================
auth.token=



# ==========================================
# Configuración certificados
# ==========================================
jetty.ssl.keystore.path=
jetty.ssl.keystore.password=
jetty.ssl.truststore.path=
jetty.ssl.truststore.password=
jetty.ssl.requireClientAuth=true
jetty.ssl.validatePeerCerts=false
jetty.ssl.enableCRLDP=false
jetty.ssl.enableOCSP=false


# ==========================================
# Configuración certificado autorizado
# ==========================================
auth.cert.whitelist=

