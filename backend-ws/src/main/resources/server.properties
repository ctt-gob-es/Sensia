# ==========================================
# Configuración del Servidor Jetty
# ==========================================
jetty.http.enabled=true
jetty.http.port=80
jetty.ssl.enabled=true
jetty.https.port=7443
jetty.https.enabled=true
jetty.ssl.port=8443

# Máximo de hilos concurrentes en todo el servidor
jetty.threadpool.maxThreads=200
# Hilos mínimos siempre vivos esperando peticiones
jetty.threadpool.minThreads=10
# Tiempo en milisegundos para destruir hilos inactivos (60s)
jetty.threadpool.idleTimeoutMs=60000
# Tiempo en milisegundos para cerrar conexiones HTTP sin actividad (30s)
jetty.connector.idleTimeoutMs=30000
# Máximo de peticiones SOAP procesándose al mismo tiempo
jetty.qos.maxRequests=50
# Tiempo máximo en milisegundos que una petición esperará en cola (5s) antes de dar HTTP 503
jetty.qos.suspendMs=5000
# Límite máximo del body para peticiones HTTP/SOAP en bytes (70 MB = 73400320: un PDF de 50 MB en base64)
jetty.http.maxPostSize=73400320
