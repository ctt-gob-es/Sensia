<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-left">
      <a routerLink="/" class="navbar-brand logo-link">
        <img src="/logo.png" alt="" class="navbar-logo">
        <span>SensIA<span class="brand-long"> - Sensor Inteligente de Anonimización</span></span>        
      </a>
    </div>
    <div class="navbar-right">
      <div *ngIf="user" class="user-menu" (click)="toggleUserMenu()">
        <div class="user-avatar">
          <svg fill="#CCCCCC" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M12,12c2.21,0,4-1.79,4-4s-1.79-4-4-4-4,1.79-4,4S9.79,12,12,12z M12,14c-2.67,0-8,1.34-8,4v2h16v-2 C20,15.34,14.67,14,12,14z" />
          </svg>
        </div>
        <span class="user-name">{{ user }}</span>
        <span class="dropdown-caret">▼</span>

        <div class="dropdown-menu" *ngIf="isUserMenuOpen()">
          <a (click)="onAccount.emit()">Mi Cuenta</a>
          <a (click)="onSettings.emit()">Configuración</a>
          <a (click)="onAdmin.emit()" *ngIf="isAdmin()">Administración</a>
          <hr>
          <a (click)="onLogout.emit()">Cerrar Sesión</a>
        </div>
      </div>
    </div>
  </div>
</nav>
