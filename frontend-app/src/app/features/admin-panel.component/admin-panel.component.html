<div class="admin-container">

  <header class="admin-header">
    <h3 class="admin-title">Panel de Control Administrativo</h3>
    <div class="header-actions">
      <label class="switch-container" title="Modo de Mantenimiento">
        <input type="checkbox" [checked]="maintenanceMode()"
          (change)="toggleConfig('maintenanceMode', maintenanceMode())">
        <span class="switch-slider rounded"></span>
        <span class="switch-label">{{ maintenanceMode() ? 'Sitio NO ACTIVO' : 'Sitio ACTIVO' }}</span>
      </label>
      <label class="switch-container" title="Registro de Usuarios">
        <input type="checkbox" [checked]="registrationEnabled()"
          (change)="toggleConfig('registrationEnabled', registrationEnabled())">
        <span class="switch-slider rounded"></span>
        <span class="switch-label">Registro activo</span>
      </label>
      <label class="switch-container" title="Recuperación de Contraseñas">
        <input type="checkbox" [checked]="passwordRecoveryEnabled()"
          (change)="toggleConfig('passwordRecoveryEnabled', passwordRecoveryEnabled())">
        <span class="switch-slider rounded"></span>
        <span class="switch-label">Recuperar Contraseña</span>
      </label>
      <label class="switch-container" title="Captcha activo">
        <input type="checkbox" [checked]="captchaEnabled()" (change)="toggleConfig('captchaEnabled', captchaEnabled())">
        <span class="switch-slider rounded"></span>
        <span class="switch-label">Captcha activo</span>
      </label>
    </div>
    <div class="header-buttons">
      <div class="action-buttons-group">
        <button (click)="openCreateUserModal()" class="btn-create-user">
          Crear Usuario
        </button>
        <button (click)="goBack()" class="btn-cancel" style="border: 1px solid #dadce0;">Volver</button>
      </div>
    </div>
  </header>

  <hr class="header-hr">

  <div *ngIf="isModalOpen()" class="modal-overlay">
    <div class="modal-content card">
      <h3>{{ isEditing() ? '✏️ Editar Usuario' : '➕ Nuevo Usuario' }}</h3>
      <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="user-form-modal">
        <input formControlName="username" placeholder="Usuario">
        <input formControlName="email" placeholder="Email">
        <select formControlName="role">
          <option value="user">Usuario</option>
          <option value="admin">Admin</option>
        </select>
        <div class="password-wrapper">
          <input formControlName="password" [type]="showCurrent() ? 'text' : 'password'" placeholder="Contraseña">
          <!-- Generar contraseña -->
          <button type="button" class="icon-btn" (click)="generatePassword()" title="Generar contraseña">
            ↻
          </button>

          <!-- Copiar -->
          <button type="button" class="icon-btn" (click)="copyPassword()" title="Copiar contraseña">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor">
              <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1
        0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9
        2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" />
            </svg>
          </button>

          <button type="button" class="eye-btn" (click)="showCurrent.set(!showCurrent())"
            title="Mostrar/Ocultar contraseña">
            <svg *ngIf="!showCurrent()" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path
                d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
            </svg>
            <svg *ngIf="showCurrent()" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path
                d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z" />
            </svg>
          </button>
        </div>
        <div class="modal-buttons">
          <button type="button" class="btn-cancel" (click)="resetForm()">Cancelar</button>
          <button type="submit" [disabled]="userForm.invalid" class="btn-save">
            {{ isEditing() ? 'Guardar Cambios' : 'Crear Usuario' }}
          </button>
        </div>
      </form>
    </div>
  </div>

  <table class="user-table card">
    <thead>
      <tr>
        <th>Usuario</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users()" [class.blocked-row]="user.isBlocked" class="user-row">
        <td data-label="Usuario">{{ user.username }}</td>
        <td data-label="Email">{{ user.email }}</td>
        <td data-label="Rol"><span class="badge badge-{{user.role}}">{{ user.role }}</span></td>
        <td data-label="Estado">{{ user.isBlocked ? '🚫 Bloqueado' : '✅ Activo' }}</td>
        <td class="actions-cell">
          <div class="menu-container">
            <button class="menu-trigger" (click)="toggleMenu(user.id, $event)">⋮</button>

            <div class="menu-content card" *ngIf="openMenuId() === user.id" (click)="$event.stopPropagation()">
              <button (click)="editUser(user)" class="menu-btn">Editar</button>
              <button (click)="toggleBlock(user.id)" class="menu-btn">{{ user.isBlocked ? 'Desbloquear' : 'Bloquear'
                }}</button>
              <button (click)="deleteUser(user.id)" class="menu-btn btn-danger">Eliminar</button>
            </div>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
